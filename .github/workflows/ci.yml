
name: CI

on: [push]

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version: '14.21.3'
    - name: Install dependencies
      run: yarn
    - name: Validate
      run: yarn validate
